on:
  pull_request:
jobs:
  routed:
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && fromJSON('["self-hosted","Linux","X64","ankiquest","build"]') || 'ubuntu-24.04' }}
  hosted:
    runs-on: ubuntu-latest
  matrix:
    strategy:
      matrix:
        os: [ubuntu-24.04, 'macos-15']
    runs-on: ${{ matrix.os }}
  local:
    uses: ./.github/workflows/other.yml
  shared:
    uses: AnkiQuest/AnkiQuest-Dev/.github/workflows/labels.yml@main
