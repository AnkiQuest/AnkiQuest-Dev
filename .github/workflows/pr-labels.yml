name: Pull Request Labels

# Keeps pull request labels current:
# - area labels from the changed paths (.github/labeler.yml)
# - "Needs Review" while a pull request waits on a reviewer: open, not a
#   draft, not approved by another member and with no member's change
#   request on its current head (.github/scripts/needs-review.cjs)
# - "New contributor" on a first pull request from someone new to the repo
# - workflow labels are cleared when a pull request is closed
#
# pull_request_target runs the base branch's workflow with a token that can
# label pull requests from forks. pull_request_review runs the pull
# request's own workflow, with a read-only token for pull requests from
# forks; their reviews are skipped and picked up by the next push, state
# change or sweep. The sweep, on schedule and workflow_dispatch, applies the
# same rule to every open pull request, so labels set by older rules or
# missed runs are corrected.
#
# Nothing here checks out or runs pull request code: the jobs read the event
# payload and the GitHub API, and load needs-review.cjs from a checkout of
# AnkiQuest-Dev's master.
#
# Reusable: each repository calls it from pull_request_target (opened,
# reopened, synchronize, ready_for_review, converted_to_draft, closed),
# pull_request_review (submitted, dismissed), schedule, workflow_dispatch and
# merge_group, and keeps its own .github/labeler.yml. The caller grants
# `contents: read` and `pull-requests: write`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  area:
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Each run labels from the current changed paths, so a newer push
    # replaces an older run.
    concurrency:
      group: ${{ github.workflow }}-area-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # labels pull requests
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true

  status:
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    # Each run reads the pull request and its reviews from the API, so a
    # newer event replaces an older run. Fork review runs can't label and
    # get a group of their own, so they never cancel a run that can.
    concurrency:
      group: ${{ github.workflow }}-status-${{ github.event.pull_request.number }}-${{ github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name != github.repository && 'read-only' || 'write' }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # labels pull requests
    steps:
      # The rule, from AnkiQuest-Dev's master like this workflow; never the
      # pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Dev
          ref: master
          path: ankiquest-dev
          persist-credentials: false
          sparse-checkout: .github/scripts/needs-review.cjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const { LABEL, syncLabels } = require('./ankiquest-dev/.github/scripts/needs-review.cjs');
            const pull_number = context.payload.pull_request.number;

            // Review runs for pull requests from forks have a read-only token.
            const head = context.payload.pull_request.head.repo?.full_name;
            if (context.eventName === 'pull_request_review' && head !== `${owner}/${repo}`) {
              core.notice(`Skipped: a review of a pull request from ${head ?? 'a deleted fork'} runs with a read-only token. "${LABEL}" is updated on the next push, state change or sweep.`);
              return;
            }

            // Read the pull request now: a queued run's payload can be stale.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            await syncLabels({ github, core, owner, repo, pr });

  # Applies the status rule to every open pull request, including those from
  # forks: the scheduled run has the repository's own token.
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-sweep
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # labels pull requests
    steps:
      # The rule, from AnkiQuest-Dev's master like this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AnkiQuest/AnkiQuest-Dev
          ref: master
          path: ankiquest-dev
          persist-credentials: false
          sparse-checkout: .github/scripts/needs-review.cjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const { syncLabels } = require('./ankiquest-dev/.github/scripts/needs-review.cjs');

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            for (const pr of pulls) {
              await syncLabels({ github, core, owner, repo, pr });
            }

  newcomer:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # labels pull requests
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'New contributor';
            const NEWCOMERS = ['FIRST_TIMER', 'FIRST_TIME_CONTRIBUTOR', 'NONE'];
            const pr = context.payload.pull_request;

            if (!NEWCOMERS.includes(pr.author_association)) {
              return;
            }
            core.info(`Adding "${LABEL}"`);
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
