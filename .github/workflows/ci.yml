name: CI

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run; pushes to master and merge
# queue entries each keep theirs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed, from this pull request's
  # own code-changed action. The other jobs skip a docs-only change; nothing
  # here reads the docs.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: changed
        uses: ./.github/actions/code-changed

  # Formatting and evaluation of the WSL system and every dev shell, and
  # actionlint; nothing large is built. Runs this pull request's own
  # nix-check.yml. The flake's checks include the formatting.
  flake:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/nix-check.yml
    with:
      all-systems: true
      format: ""
      actionlint: true
      timeout-minutes: 20

  # zizmor's security audit of the workflows and actions, a check of its
  # own so a ruleset can require it. It reports as `zizmor / check`.
  zizmor:
    needs: changes
    uses: ./.github/workflows/nix-check.yml
    with:
      flake-check: false
      format: ""
      zizmor: true
      skip: ${{ needs.changes.outputs.code != 'true' }}
      timeout-minutes: 15

  # The label set, the reusable labelling workflows' scripts and the
  # code-changed action's glob rules.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test the label workflows and code-changed
        run: nix develop .#gallery -c node --experimental-strip-types --no-warnings=ExperimentalWarning --test tests/*.test.ts

  # The banner tool (tools/banner), a Cargo workspace of its own. The
  # flake's checks.banner runs its tests too.
  banner:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/banner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/banner

      - name: Format, lint and test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
