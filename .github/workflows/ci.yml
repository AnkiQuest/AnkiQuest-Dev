name: CI

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting and evaluation of the WSL system and every dev shell; nothing
  # large is built. Merge queue groups and pushes to master run on
  # AnkiQuest's self-hosted runners, everything else, pull requests
  # included, on GitHub's (float3/nixos, nixos/runner-policy.nix);
  # checks.runner-routing fails any other routing.
  flake:
    runs-on: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && fromJSON('["self-hosted","Linux","X64","ankiquest","build"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The self-hosted runners bring their own single-user Nix.
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: runner.environment == 'github-hosted'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the flake
        run: nix flake check --all-systems

  # The label set and the reusable labelling workflows' scripts.
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint the workflows
        run: nix develop -c actionlint

      - name: Test the label workflows
        run: nix develop .#gallery -c node --experimental-strip-types --no-warnings=ExperimentalWarning --test tests/*.test.ts

  # The banner tool (tools/banner), a Cargo workspace of its own. The
  # flake's checks.banner runs its tests too.
  banner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/banner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/banner

      - name: Format, lint and test
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
