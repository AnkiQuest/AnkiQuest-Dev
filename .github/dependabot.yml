# Bumps the commit SHAs third-party actions are pinned to, in the workflows
# and in the composite actions. AnkiQuest's own actions stay at master.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A release gets a week before it is proposed, so a bad or compromised
    # one has time to be pulled.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: AnkiQuest/*
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
