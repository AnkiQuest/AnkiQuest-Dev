# Generated from shells/toolchains.nix by `nix build .#windows-configuration`.
# Do not edit; change the pins there and copy the result here.
# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Install Git.Git 2.56.0
      settings:
        id: Git.Git
        version: "2.56.0"
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: rustup
      directives:
        description: Install Rustlang.Rustup 1.29.3
      settings:
        id: Rustlang.Rustup
        version: "1.29.3"
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: node
      directives:
        description: Install OpenJS.NodeJS.22 22.23.5
      settings:
        id: OpenJS.NodeJS.22
        version: "22.23.5"
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      directives:
        description: Install astral-sh.uv 0.13.9
      settings:
        id: astral-sh.uv
        version: "0.13.9"
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: jdk
      directives:
        description: Install EclipseAdoptium.Temurin.21.JDK 21.0.11.10
      settings:
        id: EclipseAdoptium.Temurin.21.JDK
        version: "21.0.11.10"
        source: winget
    - resource: PSDscResources/Script
      id: rust-toolchains
      dependsOn:
        - rustup
      directives:
        description: Set up rust-toolchains
      settings:
        GetScript: "@{ Result = 'rust-toolchains' }"
        TestScript: |
          (& "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain list) -match '^1.100.0-' -and (& "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain list) -match '^1.97.1-'
        SetScript: |
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain install 1.100.0 --profile minimal --component clippy,rustfmt,rust-src,rust-analyzer --target wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,rust-src,rust-analyzer --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
    - resource: PSDscResources/Script
      id: python
      dependsOn:
        - uv
      directives:
        description: Set up python
      settings:
        GetScript: "@{ Result = 'python' }"
        TestScript: |
          $false
        SetScript: |
          & "$env:LOCALAPPDATA\Microsoft\WinGet\Links\uv.exe" python install 3.13 3.12
    - resource: PSDscResources/Script
      id: android-sdk
      dependsOn:
        - jdk
      directives:
        description: Set up android-sdk
      settings:
        GetScript: "@{ Result = 'android-sdk' }"
        TestScript: |
          (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'platform-tools')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'platforms\android-36')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'platforms\android-37.0')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'build-tools\35.0.0')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'build-tools\36.0.0')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'build-tools\37.0.0')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'ndk\28.2.13676358')) -and (Test-Path (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'ndk\29.0.14206865'))
        SetScript: |
          $env:JAVA_HOME = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'Machine')
          if (-not (Test-Path "$env:LOCALAPPDATA\Android\Sdk\cmdline-tools\latest\bin\sdkmanager.bat")) {
            $zip = Join-Path $env:TEMP 'android-cmdline-tools.zip'
            Invoke-WebRequest -Uri 'https://dl.google.com/android/repository/commandlinetools-win-16111833_latest.zip' -OutFile $zip
            if ((Get-FileHash -Algorithm SHA1 $zip).Hash -ne '57D04F2D75EB8E8FFFC5000A987E5DE4B5A63E9D') { throw 'cmdline-tools checksum mismatch' }
            Expand-Archive $zip -DestinationPath (Join-Path $env:TEMP 'android-cmdline-tools') -Force
            New-Item -ItemType Directory -Force (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'cmdline-tools') | Out-Null
            Move-Item (Join-Path $env:TEMP 'android-cmdline-tools\cmdline-tools') (Join-Path "$env:LOCALAPPDATA\Android\Sdk" 'cmdline-tools\latest')
          }
          [Environment]::SetEnvironmentVariable('ANDROID_HOME', "$env:LOCALAPPDATA\Android\Sdk", 'User')
          1..20 | ForEach-Object { 'y' } | & "$env:LOCALAPPDATA\Android\Sdk\cmdline-tools\latest\bin\sdkmanager.bat" --licenses
          & "$env:LOCALAPPDATA\Android\Sdk\cmdline-tools\latest\bin\sdkmanager.bat" 'platform-tools' 'platforms;android-36' 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.0.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'ndk;29.0.14206865'
